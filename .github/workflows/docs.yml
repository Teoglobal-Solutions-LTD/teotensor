# Build MkDocs and publish to GitHub Pages.
#
# Flow:
#   1) build job  — installs docs deps, runs `mkdocs build --strict`,
#                   uploads the generated `site/` folder as a Pages artifact
#   2) deploy job — takes that artifact and publishes it to GitHub Pages
#
# Required once in the GitHub UI (Settings → Pages):
#   Source = "GitHub Actions"  (not "Deploy from a branch")

name: Docs

on:
  push:
    branches: [develop, main]
  # Allow manual re-publish from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build mkdocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
