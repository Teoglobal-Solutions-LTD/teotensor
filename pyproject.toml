[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "teotensor"
dynamic = ["version"]
description = "A fast, inspectable ML systems framework for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TeoTensor" }]
keywords = ["machine-learning", "observability", "clustering", "framework"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/Teoglobal-Solutions-LTD/teotensor"
Documentation = "https://github.com/Teoglobal-Solutions-LTD/teotensor"
Repository = "https://github.com/Teoglobal-Solutions-LTD/teotensor"

[tool.hatch.version]
path = "teotensor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["teotensor"]

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["teotensor", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # allow explicit typing.Any where justified
    "D105",    # missing docstring in magic method
    "N802",    # allow sklearn-style names (check_X_y)
    "N803",    # allow sklearn-style argument names (X, y)
    "N806",    # allow uppercase matrix names (X_checked, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]
"examples/**/*.py" = ["D", "ANN"]
"benchmarks/**/*.py" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# --------------------------------------------------------------------------- #
# mypy: strict static typing
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["teotensor"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*", "benchmarks.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest + coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["teotensor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
